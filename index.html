","word":"organ","pos":"n.","meaning":"器官；机构","replacements":["a part of a body"]},{"id":"type3-out of the question","category":"type3","word":"out of the question","pos":"","meaning":"不可能的事","replacements":["impossible","not an option"]},{"id":"type3-overcome","category":"type3","word":"overcome","pos":"v.","meaning":"克服","replacements":["defeat"]},{"id":"type3-overtake","category":"type3","word":"overtake","pos":"v.","meaning":"赶上","replacements":["surpass"]},{"id":"type3-paralyse","category":"type3","word":"paralyse","pos":"v.","meaning":"使麻痹，使瘫痪","replacements":["disable","incapacitate"]},{"id":"type3-paramount","category":"type3","word":"paramount","pos":"adj.","meaning":"最重要的，主要的","replacements":["principal"]},{"id":"type3-participate","category":"type3","word":"participate","pos":"v.","meaning":"参加","replacements":["join"]},{"id":"type3-patient","category":"type3","word":"patient","pos":"adj.","meaning":"/n. 有耐心的，能容忍的/病人；患者","replacements":["tolerant","calm","ill person"]},{"id":"type3-peak","category":"type3","word":"peak","pos":"n.","meaning":"/v. 最高峰，顶点/使……达到顶峰","replacements":["top"]},{"id":"type3-permit","category":"type3","word":"permit","pos":"n.","meaning":"/v. 许可证，执照/许可","replacements":["allow"]},{"id":"type3-persuade","category":"type3","word":"persuade","pos":"v.","meaning":"说服，劝说","replacements":["influence"]},{"id":"type3-pessimistic","category":"type3","word":"pessimistic","pos":"adj.","meaning":"悲观的","replacements":["negative"]},{"id":"type3-phase","category":"type3","word":"phase","pos":"n.","meaning":"阶段","replacements":["process"]},{"id":"type3-physical","category":"type3","word":"physical","pos":"adj.","meaning":"身体上的；物质的","replacements":["body"]},{"id":"type3-plagiarise","category":"type3","word":"plagiarise","pos":"v.","meaning":"抄袭","replacements":["copy"]},{"id":"type3-plenty of","category":"type3","word":"plenty of","pos":"","meaning":"大量的","replacements":["many"]},{"id":"type3-plot","category":"type3","word":"plot","pos":"v.","meaning category":"type3","word":"react","pos":"v.","meaning":"反应","replacements":["respond"]},{"id":"type3-recreation","category":"type3","word":"recreation","pos":"n.","meaning":"娱乐，消遣","replacements":["entertainment"]},{"id":"type3-reduction","category":"type3","word":"reduction","pos":"n.","meaning":"下降，减少","replacements":["decrease"]},{"id":"type3-refer to","category":"type3","word":"refer to","pos":"","meaning":"指(的是)，涉及，提及","replacements":["talk about"]},{"id":"type3-rehearsal","category":"type3","word":"rehearsal","pos":"n.","meaning":"排演；预演；练习","replacements":["preparation"]},{"id":"type3-reject","category":"type3","word":"reject","pos":"v.","meaning":"拒绝，排斥，丢弃","replacements":["exclude"]},{"id":"type3-relevant","category":"type3","word":"relevant","pos":"adj.","meaning":"相关的","replacements":["relative"]},{"id":"type3-religious","category":"type3","word":"religious","pos":"adj.","meaning":"宗教的；虔诚的","replacements":["sacred"]},{"id":"type3-reluctant","category":"type3","word":"reluctant","pos":"adj.","meaning":"不情愿的","replacements":["unwilling"]},{"id":"type3-reproduce","category":"type3","word":"reproduce","pos":"v.","meaning":"繁殖","replacements":["breed"]},{"id":"type3-responsible","category":"type3","word":"responsible","pos":"adj.","meaning":"负责的，可靠的；有责任的","replacements":["liable"]},{"id":"type3-revision","category":"type3","word":"revision","pos":"n.","meaning":"修正","replacements":["editing"]},{"id":"type3-revive","category":"type3","word":"revive","pos":"v.","meaning":"使复苏，恢复","replacements":["renaissance"]},{"id":"type3-ruin","category":"type3","word":"ruin","pos":"v.","meaning":"毁灭","replacements":["destroy"]},{"id":"type3-scenic","category":"type3","word":"scenic","pos":"adj.","meaning":"风景优美的","replacements":["beautiful"]},{"id":"type3-shade","category":"type3","word":"shade","pos":"n.","meaning":"遮阳；阴影","replacements":["shelter"]},{"id":"type3-skepticism","category":"type3","word":"skepticism","pos":"n.","meaning":"怀疑","replacements":["doubt"]},{"id":"type3-soar","category":"type3","word":"soar","pos":"v.","meaning":"激增","replacements":["increase"]},{"id":"type3-solely","category":"type3","word":"solely","pos":"adv.","meaning":"唯一地","replacements":["alone"]},{"id":"type3-solicitor","category":"type3","word":"solicitor","pos":"n.","meaning":"律师","replacements":["lawyer"]},{"id":"type3-steer","category":"type3","word":"steer","pos":"v.","meaning":"控制，引导","replacements":["manage"]},{"id":"type3-stimulate","category":"type3","word":"stimulate","pos":"v.","meaning":"刺激，激励","replacements":["motivate"]},{"id":"type3-stride","category":"type3","word":"stride","pos":"n.","meaning":"进展","replacements":["progress"]},{"id":"type3-succumb","category":"type3","word":"succumb","pos":"","meaning":"vi. 屈服","replacements":["yield"]},{"id":"type3-subdivide","category":"type3","word":"subdivide","pos":"v.","meaning":"把……细分","replacements":["break down"]},{"id":"type3-subtle","category":"type3","word":"subtle","pos":"adj.","meaning":"微妙的","replacements":["delicate"]},{"id":"type3-substance","category":"type3","word":"substance","pos":"n.","meaning":"物质；实质","replacements":["matter"]},{"id":"type3-sufficiency","category":"type3","word":"sufficiency","pos":"n.","meaning":"足量，充足","replacements":["enough"]},{"id":"type3-supersede","category":"type3","word":"supersede","pos":"v.","meaning":"取代，代替","replacements":["replace"]},{"id":"type3-suppress","category":"type3","word":"suppress","pos":"v.","meaning":"抑制，隐瞒","replacements":["hold"]},{"id":"type3-supremacy","category":"type3","word":"supremacy","pos":"n.","meaning":"至高无上，很高的地位","replacements":["priority"]},{"id":"type3-suspicious","category":"type3","word":"suspicious","pos":"adj.","meaning":"可疑的","replacements":["odd"]},{"id":"type3-sustainable","category":"type3","word":"sustainable","pos":"adj.","meaning":"可持续的","replacements":["long-term"]},{"id":"type3-symptom","category":"type3","word":"symptom","pos":"n.","meaning":"症状，征兆","replacements":["sign"]},{"id":"type3-tension","category":"type3","word":"tension","pos":"n.","meaning":"紧张，不安","replacements":["upset"]},{"id":"type3-term","category":"type3","word":"term","pos":"n.","meaning":"术语","replacements":["word"]},{"id":"type3-throughout","category":"type3","word":"throughout","pos":"adv.","meaning":"自始至终，到处；全部","replacements":["anywhere"]},{"id":"type3-toll","category":"type3","word":"toll","pos":"n.","meaning":"/v. 通行费/征收","replacements":["charge"]},{"id":"type3-trace","category":"type3","word":"trace","pos":"n.","meaning":"追溯；痕迹","replacements":["track"]},{"id":"type3-transcend","category":"type3","word":"transcend","pos":"v.","meaning":"胜过，超越","replacements":["excel"]},{"id":"type3-transit","category":"type3","word":"transit","pos":"n.","meaning":"/v. 运输；经过/运送","replacements":["send"]},{"id":"type3-tremendous","category":"type3","word":"tremendous","pos":"adj.","meaning":"巨大的，惊人的","replacements":["vast"]},{"id":"type3-trigger","category":"type3","word":"trigger","pos":"n.","meaning":"触发，引发，引起","replacements":["begin"]},{"id":"type3-tropical","category":"type3","word":"tropical","pos":"adj.","meaning":"热带的","replacements":["hot"]},{"id":"type3-unbiased","category":"type3","word":"unbiased","pos":"adj.","meaning":"公正的，无偏见的","replacements":["fair"]},{"id":"type3-uniform","category":"type3","word":"uniform","pos":"adj.","meaning":"始终如一的","replacements":["consistent"]},{"id":"type3-valuable","category":"type3","word":"valuable","pos":"adj.","meaning":"宝贵的，有价值的","replacements":["benefit"]},{"id":"type3-versatile","category":"type3","word":"versatile","pos":"adj.","meaning":"多功能","replacements":["all-around"]},{"id":"type3-view","category":"type3","word":"view","pos":"v.","meaning":"看","replacements":["overlook"]},{"id":"type3-violent","category":"type3","word":"violent","pos":"adj.","meaning":"暴力的；猛烈的","replacements":["fierce"]},{"id":"type3-visible","category":"type3","word":"visible","pos":"adj.","meaning":"明显的，看得见的","replacements":["see"]},{"id":"type3-visual","category":"type3","word":"visual","pos":"adj.","meaning":"视觉的","replacements":["image"]},{"id":"type3-well-being","category":"type3","word":"well-being","pos":"n.","meaning":"健康，幸福，福祉","replacements":["health","happiness","welfare"]}];
    const STORAGE_KEY = "ielts-538-offline-progress";
    const CATEGORIES = [
      { id: "type1", label: "第一类", note: "150 道循环练习" },
      { id: "type2", label: "第二类", note: "100 个考点词" },
      { id: "type3", label: "第三类", note: "256 个考点词" },
      { id: "mixed", label: "混合训练", note: "一到三类全部词" }
    ];
    const counts = { type1: 150, type2: 100, type3: 256, mixed: WORDS.length };
    let category = new URLSearchParams(location.search).get("category");
    if (!CATEGORIES.some((item) => item.id === category)) category = "mixed";
    let questionCount = 10;
    let session = null;
    let selected = "";
    let submitted = false;
    let answers = [];
    let result = null;

    function shuffle(items) { return [...items].sort(() => Math.random() - 0.5); }
    function progress() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { attempted: [], wrong: [] }; }
      catch { return { attempted: [], wrong: [] }; }
    }
    function saveProgress(value) { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); }
    function selectedWords() {
      const base = category === "mixed" ? WORDS : WORDS.filter((word) => word.category === category);
      if (category !== "type1") return base;
      return Array.from({ length: 150 }, (_, index) => {
        const word = base[index % base.length];
        return { ...word, id: word.id + "-practice-" + (index + 1), correct: word.replacements[index % word.replacements.length] };
      });
    }
    function questionFor(word, allWords) {
      const correct = word.correct || word.replacements[0];
      const distractors = shuffle(allWords.flatMap((item) => item.replacements)
        .filter((item) => !word.replacements.includes(item) && item !== correct)).slice(0, 3);
      return { word, correct, options: shuffle([correct, ...distractors]) };
    }
    function start() {
      const pool = selectedWords();
      session = {
        questions: shuffle(pool)
          .slice(0, Math.min(questionCount, pool.length))
          .map((word) => questionFor(word, pool)),
        index: 0
      };
      selected = ""; submitted = false; answers = []; result = null; render();
    }
    function submit() {
      if (!selected || submitted) return;
      const current = session.questions[session.index];
      const correct = selected === current.correct;
      const old = progress();
      old.attempted = [...new Set([...old.attempted, current.word.id])];
      old.wrong = correct ? old.wrong.filter((id) => id !== current.word.id) : [...new Set([...old.wrong, current.word.id])];
      saveProgress(old);
      answers.push({ correct }); submitted = true; render();
    }
    function next() {
      if (session.index >= session.questions.length - 1) {
        result = { total: session.questions.length, correct: answers.filter((item) => item.correct).length };
        session = null; selected = ""; submitted = false; render(); return;
      }
      session.index += 1; selected = ""; submitted = false; render();
    }
    function render() {
      const app = document.querySelector("#app");
      const currentPool = selectedWords();
      const state = progress();
      if (!session && result) {
        const wrong = result.total - result.correct;
        const accuracy = result.total ? Math.round((result.correct / result.total) * 100) : 0;
        app.innerHTML = `
          <section class="panel result">
            <p class="eyebrow" style="color:#0284c7">Session Summary</p>
            <h2>本轮训练完成</h2>
            <strong>${accuracy}%</strong>
            <p class="muted">正确率</p>
            <div class="categories">
              <div class="category"><strong>${result.total}</strong><span>做了多少题</span></div>
              <div class="category"><strong>${result.correct}</strong><span>答对</span></div>
              <div class="category"><strong>${wrong}</strong><span>答错</span></div>
            </div>
            <button class="primary" id="restart">再练一轮</button>
          </section>`;
        document.querySelector("#restart").onclick = start;
        return;
      }
      if (!session) {
        app.innerHTML = `
          <section class="panel">
            <div class="panel-head"><div><p class="eyebrow" style="color:#0284c7">训练入口</p><h2>准备开始</h2></div><div class="stats"><strong>${currentPool.length}</strong><span>可用题目</span></div></div>
            <div class="categories">${CATEGORIES.map((item) => `
              <button class="category ${category === item.id ? "selected" : ""}" data-category="${item.id}">
                <strong>${item.label}</strong><span>${counts[item.id]} 题</span><small>${item.note}</small>
              </button>`).join("")}</div>
            <div class="controls"><label for="question-count">本轮题量</label><select id="question-count">${[5,10,20,50].map((value) => `<option value="${value}" ${questionCount === value ? "selected" : ""}>${value} 题</option>`).join("")}</select></div>
            <div class="summary"><span>已练过 ${state.attempted.length} / ${currentPool.length}</span><span>错题 ${state.wrong.length} 题</span></div>
            <button class="primary" id="start" style="margin-top:20px">开始训练</button>
          </section>`;
        document.querySelectorAll("[data-category]").forEach((button) => button.onclick = () => {
          category = button.dataset.category;
          const url = new URL(location.href); url.searchParams.set("category", category); history.replaceState({}, "", url);
          render();
        });
        document.querySelector("#question-count").onchange = (event) => { questionCount = Number(event.target.value); };
        document.querySelector("#start").onclick = start;
        return;
      }

      const current = session.questions[session.index];
      const isCorrect = submitted && selected === current.correct;
      app.innerHTML = `
        <section class="panel">
          <div class="progress"><span>${CATEGORIES.find((item) => item.id === category).label} · 538</span><span>第 ${session.index + 1} / ${session.questions.length} 题</span></div>
          <div class="question-head"><p class="eyebrow" style="color:#0284c7">题目用词</p><h2>${current.word.word}</h2><p>${current.word.pos} · ${current.word.meaning}</p></div>
          <div class="prompt">Which phrase is closest in meaning to <strong>${current.word.word}</strong> in an IELTS reading passage?</div>
          <div class="options">${current.options.map((option, index) => {
            const optionCorrect = option === current.correct;
            const className = submitted ? (optionCorrect ? "correct" : selected === option ? "wrong" : "") : selected === option ? "selected" : "";
            return `<label class="option ${className}"><input type="radio" name="answer" value="${option}" ${selected === option ? "checked" : ""} ${submitted ? "disabled" : ""}><span class="letter">${String.fromCharCode(65 + index)}</span><span>${option}</span></label>`;
          }).join("")}</div>
          ${submitted ? `<div class="feedback ${isCorrect ? "correct" : "wrong"}"><strong>${isCorrect ? "✓ 正确" : "✗ 再看一眼"}</strong><p>正确答案：<b>${current.correct}</b></p><p>命题替换：${current.word.word} → ${current.word.replacements.join(" / ")}</p><button class="primary" id="next">${session.index === session.questions.length - 1 ? "查看结果" : "下一题"}</button></div>` : `<button class="primary" id="submit" ${selected ? "" : "disabled"}>提交答案</button>`}
        </section><div class="score">本轮当前正确 ${answers.filter((item) => item.correct).length} 题</div>`;
      document.querySelectorAll("input[name=answer]").forEach((input) => input.onchange = (event) => { selected = event.target.value; render(); });
      if (!submitted) document.querySelector("#submit").onclick = submit;
      else document.querySelector("#next").onclick = next;
    }
    render();
  </script>
