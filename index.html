ng":"遮阳；阴影","replacementMeanings":{"shelter":"庇护所；掩蔽/庇护；遮蔽"},"replacements":["shelter"]},{"id":"type3-skepticism","category":"type3","word":"skepticism","pos":"n.","meaning":"怀疑","replacementMeanings":{"doubt":"怀疑，疑问/怀疑；不信"},"replacements":["doubt"]},{"id":"type3-soar","category":"type3","word":"soar","pos":"v.","meaning":"激增","replacementMeanings":{"increase":"增加，增长/（使）增加，（使）增长"},"replacements":["increase"]},{"id":"type3-solely","category":"type3","word":"solely","pos":"adv.","meaning":"唯一地","replacementMeanings":{"alone":"词库未收录"},"replacements":["alone"]},{"id":"type3-solicitor","category":"type3","word":"solicitor","pos":"n.","meaning":"律师","replacementMeanings":{"lawyer":"词库未收录"},"replacements":["lawyer"]},{"id":"type3-steer","category":"type3","word":"steer","pos":"v.","meaning":"控制，引导","replacementMeanings":{"manage":"管理；设法做到"},"replacements":["manage"]},{"id":"type3-stimulate","category":"type3","word":"stimulate","pos":"v.","meaning":"刺激，激励","replacementMeanings":{"motivate":"激发；驱使"},"replacements":["motivate"]},{"id":"type3-stride","category":"type3","word":"stride","pos":"n.","meaning":"进展","replacementMeanings":{"progress":"前进；进步；进程/前进；进步"},"replacements":["progress"]},{"id":"type3-succumb","category":"type3","word":"succumb","pos":"","meaning":"vi. 屈服","replacementMeanings":{"yield":"产出；屈服；服从；产量；投资收益"},"replacements":["yield"]},{"id":"type3-subdivide","category":"type3","word":"subdivide","pos":"v.","meaning":"把……细分","replacementMeanings":{"break down":"词库未收录"},"replacements":["break down"]},{"id":"type3-subtle","category":"type3","word":"subtle","pos":"adj.","meaning":"微妙的","replacementMeanings":{"delicate":"精致的；微妙的；脆弱的"},"replacements":["delicate"]},{"id":"type3-substance","category":"type3","word":"substance","pos":"n.","meaning":"物质；实质","replacementMeanings":{"matter":"事情；物质/要紧"},"replacements":["matter"]},{"id":"type3-sufficiency","category":"type3","word":"sufficiency","pos":"n.","meaning":"足量，充足","replacementMeanings":{"enough":"词库未收录"},"replacements":["enough"]},{"id":"type3-supersede","category":"type3","word":"supersede","pos":"v.","meaning":"取代，代替","replacementMeanings":{"replace":"代替；取代"},"replacements":["replace"]},{"id":"type3-suppress","category":"type3","word":"suppress","pos":"v.","meaning":"抑制，隐瞒","replacementMeanings":{"hold":"词库未收录"},"replacements":["hold"]},{"id":"type3-supremacy","category":"type3","word":"supremacy","pos":"n.","meaning":"至高无上，很高的地位","replacementMeanings":{"priority":"词库未收录"},"replacements":["priority"]},{"id":"type3-suspicious","category":"type3","word":"suspicious","pos":"adj.","meaning":"可疑的","replacementMeanings":{"odd":"奇数的；古怪的"},"replacements":["odd"]},{"id":"type3-sustainable","category":"type3","word":"sustainable","pos":"adj.","meaning":"可持续的","replacementMeanings":{"long-term":"词库未收录"},"replacements":["long-term"]},{"id":"type3-symptom","category":"type3","word":"symptom","pos":"n.","meaning":"症状，征兆","replacementMeanings":{"sign":"符号；征兆；迹象；手势；签（名）"},"replacements":["sign"]},{"id":"type3-tension","category":"type3","word":"tension","pos":"n.","meaning":"紧张，不安","replacementMeanings":{"upset":"使心烦意乱；使生气；搅乱；打翻"},"replacements":["upset"]},{"id":"type3-term","category":"type3","word":"term","pos":"n.","meaning":"术语","replacementMeanings":{"word":"词库未收录"},"replacements":["word"]},{"id":"type3-throughout","category":"type3","word":"throughout","pos":"adv.","meaning":"自始至终，到处；全部","replacementMeanings":{"anywhere":"词库未收录"},"replacements":["anywhere"]},{"id":"type3-toll","category":"type3","word":"toll","pos":"n.","meaning":"/v. 通行费/征收","replacementMeanings":{"charge":"词库未收录"},"replacements":["charge"]},{"id":"type3-trace","category":"type3","word":"trace","pos":"n.","meaning":"追溯；痕迹","replacementMeanings":{"track":"追踪；足迹；踪迹；轨道"},"replacements":["track"]},{"id":"type3-transcend","category":"type3","word":"transcend","pos":"v.","meaning":"胜过，超越","replacementMeanings":{"excel":"词库未收录"},"replacements":["excel"]},{"id":"type3-transit","category":"type3","word":"transit","pos":"n.","meaning":"/v. 运输；经过/运送","replacementMeanings":{"send":"词库未收录"},"replacements":["send"]},{"id":"type3-tremendous","category":"type3","word":"tremendous","pos":"adj.","meaning":"巨大的，惊人的","replacementMeanings":{"vast":"词库未收录"},"replacements":["vast"]},{"id":"type3-trigger","category":"type3","word":"trigger","pos":"n.","meaning":"触发，引发，引起","replacementMeanings":{"begin":"词库未收录"},"replacements":["begin"]},{"id":"type3-tropical","category":"type3","word":"tropical","pos":"adj.","meaning":"热带的","replacementMeanings":{"hot":"词库未收录"},"replacements":["hot"]},{"id":"type3-unbiased","category":"type3","word":"unbiased","pos":"adj.","meaning":"公正的，无偏见的","replacementMeanings":{"fair":"公平的；公章的"},"replacements":["fair"]},{"id":"type3-uniform","category":"type3","word":"uniform","pos":"adj.","meaning":"始终如一的","replacementMeanings":{"consistent":"一致的；（观点或看法）连贯的"},"replacements":["consistent"]},{"id":"type3-valuable","category":"type3","word":"valuable","pos":"adj.","meaning":"宝贵的，有价值的","replacementMeanings":{"benefit":"益处/有利于；获益"},"replacements":["benefit"]},{"id":"type3-versatile","category":"type3","word":"versatile","pos":"adj.","meaning":"多功能","replacementMeanings":{"all-around":"词库未收录"},"replacements":["all-around"]},{"id":"type3-view","category":"type3","word":"view","pos":"v.","meaning":"看","replacementMeanings":{"overlook":"远眺；俯瞰；未注意到"},"replacements":["overlook"]},{"id":"type3-violent","category":"type3","word":"violent","pos":"adj.","meaning":"暴力的；猛烈的","replacementMeanings":{"fierce":"凶猛的；猛烈的；（天气或温度）恶劣的"},"replacements":["fierce"]},{"id":"type3-visible","category":"type3","word":"visible","pos":"adj.","meaning":"明显的，看得见的","replacementMeanings":{"see":"词库未收录"},"replacements":["see"]},{"id":"type3-visual","category":"type3","word":"visual","pos":"adj.","meaning":"视觉的","replacementMeanings":{"image":"词库未收录"},"replacements":["image"]},{"id":"type3-well-being","category":"type3","word":"well-being","pos":"n.","meaning":"健康，幸福，福祉","replacementMeanings":{"health":"词库未收录","happiness":"幸福；快乐；适当","welfare":"健康；幸福"},"replacements":["health","happiness","welfare"]}];
    const STORAGE_KEY = "ielts-538-offline-progress";
    const CATEGORIES = [
      { id: "type1", label: "第一类", note: "150 道循环练习" },
      { id: "type2", label: "第二类", note: "100 个考点词" },
      { id: "type3", label: "第三类", note: "256 个考点词" },
      { id: "mixed", label: "混合训练", note: "一到三类全部词" }
    ];
    const counts = { type1: 150, type2: 100, type3: 256, mixed: WORDS.length };
    let category = new URLSearchParams(location.search).get("category");
    if (!CATEGORIES.some((item) => item.id === category)) category = "mixed";
    let questionCount = 10;
    let showChinese = localStorage.getItem("ielts-vocab-show-chinese") !== "false";
    let showAudio = localStorage.getItem("ielts-vocab-show-audio") !== "false";
    let session = null;
    let selected = "";
    let submitted = false;
    let answers = [];
    let result = null;

    function shuffle(items) { return [...items].sort(() => Math.random() - 0.5); }
    function progress() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { attempted: [], wrong: [] }; }
      catch { return { attempted: [], wrong: [] }; }
    }
    function saveProgress(value) { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); }
    function selectedWords() {
      const base = category === "mixed" ? WORDS : WORDS.filter((word) => word.category === category);
      if (category !== "type1") return base;
      return Array.from({ length: 150 }, (_, index) => {
        const word = base[index % base.length];
        return { ...word, id: word.id + "-practice-" + (index + 1), correct: word.replacements[index % word.replacements.length] };
      });
    }
    function questionFor(word, allWords) {
      const correct = word.correct || word.replacements[0];
      const translated = [...new Set(allWords.flatMap((item) => item.replacements)
        .filter((item) => item !== correct && !word.replacements.includes(item) && allWords.some((entry) => entry.replacementMeanings?.[item] && entry.replacementMeanings[item] !== "词库未收录")))];
      const distractors = shuffle(allWords.flatMap((item) => item.replacements)
        .filter((item) => translated.includes(item))).slice(0, 3);
      return { word, correct, options: shuffle([correct, ...distractors]) };
    }
    function optionMeaning(option, word) {
      const entry = WORDS.find((item) => item.replacementMeanings?.[option] && item.replacementMeanings[option] !== "词库未收录");
      if (entry) return entry.replacementMeanings[option];
      if (word.replacements.includes(option)) return word.meaning;
      return "中文释义待补充";
    }
    function speak(text) {
      if (!showAudio || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US"; utterance.rate = 0.85; window.speechSynthesis.speak(utterance);
    }
    function start() {
      const pool = selectedWords();
      session = {
        questions: shuffle(pool)
          .slice(0, Math.min(questionCount, pool.length))
          .map((word) => questionFor(word, pool)),
        index: 0
      };
      selected = ""; submitted = false; answers = []; result = null; render();
    }
    function submit() {
      if (!selected || submitted) return;
      const current = session.questions[session.index];
      const correct = selected === current.correct;
      const old = progress();
      old.attempted = [...new Set([...old.attempted, current.word.id])];
      old.wrong = correct ? old.wrong.filter((id) => id !== current.word.id) : [...new Set([...old.wrong, current.word.id])];
      saveProgress(old);
      answers.push({ correct }); submitted = true; render();
    }
    function next() {
      if (session.index >= session.questions.length - 1) {
        result = { total: session.questions.length, correct: answers.filter((item) => item.correct).length };
        session = null; selected = ""; submitted = false; render(); return;
      }
      session.index += 1; selected = ""; submitted = false; render();
    }
    function render() {
      const app = document.querySelector("#app");
      const currentPool = selectedWords();
      const state = progress();
      if (!session && result) {
        const wrong = result.total - result.correct;
        const accuracy = result.total ? Math.round((result.correct / result.total) * 100) : 0;
        app.innerHTML = `
          <section class="panel result">
            <p class="eyebrow" style="color:#0284c7">Session Summary</p>
            <h2>本轮训练完成</h2>
            <strong>${accuracy}%</strong>
            <p class="muted">正确率</p>
            <div class="categories">
              <div class="category"><strong>${result.total}</strong><span>做了多少题</span></div>
              <div class="category"><strong>${result.correct}</strong><span>答对</span></div>
              <div class="category"><strong>${wrong}</strong><span>答错</span></div>
            </div>
            <button class="primary" id="restart">再练一轮</button>
          </section>`;
        document.querySelector("#restart").onclick = start;
        return;
      }
      if (!session) {
        app.innerHTML = `
          <section class="panel">
            <div class="panel-head"><div><p class="eyebrow" style="color:#0284c7">训练入口</p><h2>准备开始</h2></div><div class="stats"><strong>${currentPool.length}</strong><span>可用题目</span></div></div>
            <div class="categories">${CATEGORIES.map((item) => `
              <button class="category ${category === item.id ? "selected" : ""}" data-category="${item.id}">
                <strong>${item.label}</strong><span>${counts[item.id]} 题</span><small>${item.note}</small>
              </button>`).join("")}</div>
            <div class="controls"><label for="question-count">本轮题量</label><select id="question-count">${[5,10,20,50].map((value) => `<option value="${value}" ${questionCount === value ? "selected" : ""}>${value} 题</option>`).join("")}</select></div>
            <div class="settings"><strong>显示设置</strong><label><input type="checkbox" id="show-chinese" ${showChinese ? "checked" : ""}> 显示单词下方中文</label><label><input type="checkbox" id="show-audio" ${showAudio ? "checked" : ""}> 显示发音按钮</label></div>
            <div class="summary"><span>已练过 ${state.attempted.length} / ${currentPool.length}</span><span>错题 ${state.wrong.length} 题</span></div>
            <button class="primary" id="start" style="margin-top:20px">开始训练</button>
          </section>`;
        document.querySelectorAll("[data-category]").forEach((button) => button.onclick = () => {
          category = button.dataset.category;
          const url = new URL(location.href); url.searchParams.set("category", category); history.replaceState({}, "", url);
          render();
        });
        document.querySelector("#question-count").onchange = (event) => { questionCount = Number(event.target.value); };
        document.querySelector("#show-chinese").onchange = (event) => { showChinese = event.target.checked; localStorage.setItem("ielts-vocab-show-chinese", String(showChinese)); };
        document.querySelector("#show-audio").onchange = (event) => { showAudio = event.target.checked; localStorage.setItem("ielts-vocab-show-audio", String(showAudio)); };
        document.querySelector("#start").onclick = start;
        return;
      }

      const current = session.questions[session.index];
      const isCorrect = submitted && selected === current.correct;
      app.innerHTML = `
        <section class="panel">
          <div class="progress"><span>${CATEGORIES.find((item) => item.id === category).label} · 538</span><span>第 ${session.index + 1} / ${session.questions.length} 题</span></div>
          <div class="question-head"><p class="eyebrow" style="color:#0284c7">题目用词</p><h2 class="word-line">${current.word.word} ${showAudio ? `<button class="audio" data-speak="${current.word.word}" aria-label="播放单词读音">🔊</button>` : ""}</h2>${showChinese ? `<p>${current.word.pos} · ${current.word.meaning}</p>` : ""}</div>
          <div class="prompt">Which phrase is closest in meaning to <strong>${current.word.word}</strong> in an IELTS reading passage?</div>
          <div class="options">${current.options.map((option, index) => {
            const optionCorrect = option === current.correct;
            const className = submitted ? (optionCorrect ? "correct" : selected === option ? "wrong" : "") : selected === option ? "selected" : "";
            return `<label class="option ${className}"><input type="radio" name="answer" value="${option}" ${selected === option ? "checked" : ""} ${submitted ? "disabled" : ""}><span class="letter">${String.fromCharCode(65 + index)}</span><span class="option-word">${option} ${showAudio ? `<button type="button" class="audio" data-speak="${option}" aria-label="播放 ${option} 的读音">🔊</button>` : ""}<small>（中文：${optionMeaning(option, current.word)}）</small></span></label>`;
          }).join("")}</div>
          ${submitted ? `<div class="feedback ${isCorrect ? "correct" : "wrong"}"><strong>${isCorrect ? "✓ 正确" : "✗ 再看一眼"}</strong><p>正确答案：<b>${current.correct}</b></p><p>命题替换：${current.word.word} → ${current.word.replacements.join(" / ")}</p><button class="primary" id="next">${session.index === session.questions.length - 1 ? "查看结果" : "下一题"}</button></div>` : `<button class="primary" id="submit" ${selected ? "" : "disabled"}>提交答案</button>`}
        </section><div class="score">本轮当前正确 ${answers.filter((item) => item.correct).length} 题</div>`;
      document.querySelectorAll("input[name=answer]").forEach((input) => input.onchange = (event) => { selected = event.target.value; render(); });
      document.querySelectorAll("[data-speak]").forEach((button) => button.onclick = (event) => { event.preventDefault(); event.stopPropagation(); speak(button.dataset.speak); });
      if (!submitted) document.querySelector("#submit").onclick = submit;
      else document.querySelector("#next").onclick = next;
    }
    render();
  </script>
</body>
</html>
