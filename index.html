<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雅思 538 同义替换离线练习</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7fb; }
    .shell { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    .page-title { margin: 0 0 18px; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; }
    .eyebrow { margin: 0 0 8px; color: #0284c7; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h2 { margin: 0; font-size: 24px; }
    .panel { margin-top: 18px; padding: 26px; border: 1px solid #e2e8f0; border-radius: 14px; background: white; box-shadow: 0 8px 24px rgba(15,23,42,.06); }
    .panel-head, .progress, .summary { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .stats { min-width: 100px; padding: 10px; border-radius: 10px; background: #f0f9ff; text-align: center; }
    .stats strong, .stats span { display: block; }
    .stats strong { color: #0369a1; font-size: 25px; }
    .stats span, .muted { color: #64748b; font-size: 13px; }
    .categories { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 24px 0; }
    .category { padding: 16px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; text-align: left; cursor: pointer; }
    .category:hover, .category.selected { border-color: #0284c7; background: #f0f9ff; box-shadow: inset 0 0 0 1px #0284c7; }
    .category strong, .category span, .category small { display: block; }
    .category span { margin-top: 7px; color: #0369a1; font-size: 14px; }
    .category small { margin-top: 9px; color: #64748b; }
    .controls { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: #334155; font-size: 14px; }
    .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 16px 0 20px; padding: 14px 16px; border: 1px solid #dbeafe; border-radius: 10px; background: #f8fbff; color: #334155; font-size: 14px; }
    .settings label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    select { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; font: inherit; }
    button { font: inherit; }
    .primary { padding: 11px 18px; border: 0; border-radius: 8px; background: #0f172a; color: white; font-weight: 700; cursor: pointer; }
    .primary:hover { background: #334155; }
    .primary:disabled { cursor: not-allowed; opacity: .45; }
    .result-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .secondary { padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; color: #334155; font-weight: 700; cursor: pointer; }
    .secondary:hover { background: #f8fafc; }
    .summary { color: #64748b; font-size: 13px; }
    .reset-row { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; color: #64748b; font-size: 13px; }
    .progress { padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; color: #64748b; font-size: 13px; }
    .question-head { padding: 28px 0 18px; }
    .question-head h2 { margin-top: 5px; color: #0f172a; }
    .question-head p:last-child { margin: 8px 0 0; color: #64748b; font-size: 13px; }
    .prompt { margin: 16px 0; color: #334155; font-size: 17px; line-height: 1.6; }
    .options { display: grid; gap: 10px; margin-bottom: 20px; }
    .option { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #cbd5e1; border-radius: 9px; cursor: pointer; }
    .option:hover, .option.selected { border-color: #0284c7; background: #f0f9ff; }
    .option.correct { border-color: #16a34a; background: #f0fdf4; }
    .option.wrong { border-color: #e11d48; background: #fff1f2; }
    .option input { accent-color: #0284c7; }
    .letter { display: grid; width: 26px; height: 26px; place-items: center; border-radius: 50%; background: #e2e8f0; font-size: 12px; font-weight: 800; }
    .word-line, .option-word { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .audio { padding: 2px 6px; border: 1px solid #bae6fd; border-radius: 6px; background: #eff6ff; color: #0369a1; cursor: pointer; font-size: 14px; line-height: 1.2; }
    .audio:hover { background: #dbeafe; }
    .option-word small { color: #64748b; font-size: 13px; }
    .feedback { margin-top: 16px; padding: 16px; border-radius: 10px; line-height: 1.55; }
    .feedback.correct { background: #f0fdf4; color: #166534; }
    .feedback.wrong { background: #fff1f2; color: #9f1239; }
    .feedback p { margin: 6px 0; }
    .feedback .primary { margin-top: 8px; }
    .score { margin-top: 12px; color: #64748b; font-size: 13px; text-align: right; }
    .result { text-align: center; }
    .result strong { display: block; margin: 12px 0 4px; font-size: 36px; color: #0369a1; }
    @media (max-width: 700px) {
      .shell { width: min(100% - 22px, 980px); padding-top: 16px; }
      .hero, .panel { padding: 20px; }
      .categories { grid-template-columns: 1fr 1fr; }
      .panel-head { align-items: flex-start; }
    }
  </style>
</head>

    const audioPlayer = new Audio();

      const correct = word.correct || word.replacements[0];

        .filter((item) => item !== correct && item.toLowerCase() !== word.word.toLowerCase() && !word.replacements.includes(item) && allWords.some((entry) => entry.replacementMeanings?.[item] && entry.replacementMeanings[item] !== "词库未收录")))];

      return { word, correct, options: shuffle([correct, ...distractors]) };
    }

      if (contextualMeaning && contextualMeaning !== "词库未收录") return contextualMeaning;
      const entry = WORDS.find((item) => item.replacementMeanings?.[option] && item.replacementMeanings[option] !== "词库未收录");
      if (entry) return entry.replacementMeanings[option];
      if (word.replacements.includes(option)) return word.meaning;

        audioPlayer.pause();

        audioPlayer.src = audioSource;
        audioPlayer.play().catch(() => speakWithBrowser(text));

      }

          <div class="progress"><span>${CATEGORIES.find((item) => item.id === category).label} · 538</span><span>第 ${session.index + 1} / ${session.questions.length} 题</span></div>
          <div class="question-head"><p class="eyebrow" style="color:#0284c7">题目用词</p>${wordHeading}${submitted && (showChinese || listeningMode) ? `<p>${current.word.pos} · ${current.word.meaning}</p>` : ""}</div>
          <div class="prompt">${questionPrompt}</div>
          <div class="options">${current.options.map((option, index) => {
            const optionCorrect = option === current.correct;
            const className = submitted ? (optionCorrect ? "correct" : selected === option ? "wrong" : "") : selected === option ? "selected" : "";
            return `<label class="option ${className}"><input type="radio" name="answer" value="${option}" ${selected === option ? "checked" : ""} ${submitted ? "disabled" : ""}><span class="letter">${String.fromCharCode(65 + index)}</span><span class="option-word">${option} ${showAudio ? `<button type="button" class="audio" data-speak="${option}" aria-label="播放 ${option} 的读音">🔊</button>` : ""}${submitted && showChinese ? `<small>（${optionMeaning(option, current.word)}）</small>` : ""}</span></label>`;
          }).join("")}</div>
          ${submitted ? `<div class="feedback ${isCorrect ? "correct" : "wrong"}"><strong>${isCorrect ? "✓ 正确" : "✗ 再看一眼"}</strong><p>正确答案：<b>${current.correct}</b>${showChinese ? `（中文：${optionMeaning(current.correct, current.word)}）` : ""}</p><p>命题替换：${current.word.word} → ${current.word.replacements.join(" / ")}</p><button class="primary" id="next">${session.index === session.questions.length - 1 ? "查看结果" : "下一题"}</button></div>` : `<button class="primary" id="submit" ${selected ? "" : "disabled"}>提交答案</button>`}
        </section><div class="score">本轮当前正确 ${answers.filter((item) => item.correct).length} 题</div>`;
      document.querySelectorAll("input[name=answer]").forEach((input) => input.onchange = (event) => { selected = event.target.value; render(); });
      document.querySelectorAll("[data-speak]").forEach((button) => button.onclick = (event) => { event.preventDefault(); event.stopPropagation(); speak(button.dataset.speak); });
      if (!submitted) document.querySelector("#submit").onclick = submit;
      else document.querySelector("#next").onclick = next;
    }
    render();
  </script>
</body>
</html>
